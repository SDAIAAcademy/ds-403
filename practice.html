<section>
<h2>Day 1: Scores have standard errors</h2>
<ol>
<li><p>Configuration B scores 69.8% on the 600 questions, 95% interval 66.7% to 72.9%. A manager asks what the interval means. Which answer is right?</p><ul><li><b>A.</b> B passes between 66.7% and 72.9% of these 600 questions</li><li><b>B.</b> B's pass rate on questions written the same way is plausibly between 66.7% and 72.9%</li><li><b>C.</b> Each answer of B passes with a probability between 66.7% and 72.9%</li><li><b>D.</b> B will score between 66.7% and 72.9% on next year's regulations</li></ul></li>
<li><p>C's design effect is 2.5. Furat can pay for 160 more questions. Which plan narrows C's clustered interval most?</p><ul><li><b>A.</b> 160 questions from the same 80 documents, two per document</li><li><b>B.</b> Ten samples per question in place of five</li><li><b>C.</b> 160 questions from 20 new documents</li><li><b>D.</b> Report the naive interval, which is already narrower</li></ul></li>
<li><p>At temperature 0.2, D's between-item variance is 0.123 and its within-item variance 0.068. A colleague proposes 20 samples per question in place of 5 to "make the score precise". What happens?</p><ul><li><b>A.</b> The standard error barely falls, because the between-item part does not shrink with samples</li><li><b>B.</b> The standard error halves, as it would with four times the questions</li><li><b>C.</b> The pass rate rises, because more samples find more right answers</li><li><b>D.</b> The score becomes pass@20, which is the right metric at last</li></ul></li>
<li><p>The plan named the mean pass rate. After the run, D beats C on pass@5 but not on the mean. The team wants to headline pass@5 "because it shows D's potential". What should the report do?</p><ul><li><b>A.</b> Headline pass@5, since it is a recognised metric</li><li><b>B.</b> Headline pass@5 with alpha lowered to 0.01</li><li><b>C.</b> Delete pass@5 from the report entirely</li><li><b>D.</b> Headline the planned mean and label pass@5 as an unplanned, exploratory result</li></ul></li>
<li><p>An evaluation of a permits assistant reports 81% on 400 questions, 95% interval 77% to 85%. Which statement about the interval is correct?</p><ul><li><b>A.</b> It is a plausible range for the pass rate on new questions written the same way</li><li><b>B.</b> It is the range of pass rates the assistant will reach next year</li><li><b>C.</b> It is the range within which 95% of individual answers fall</li><li><b>D.</b> It is the range of pass rates on these 400 questions if the evaluation were rerun with the same answers</li></ul></li>
<li><p>A configuration passes 270 of 300 independent questions. What is the formula standard error of its pass rate, to two significant figures?</p><ul><li><b>A.</b> 0.090</li><li><b>B.</b> 0.017</li><li><b>C.</b> 0.30</li><li><b>D.</b> 0.0010</li></ul></li>
<li><p>A clustered standard error is 0.030 and the naive one is 0.020 on 900 questions. How many independent questions are the 900 worth?</p><ul><li><b>A.</b> 2,025</li><li><b>B.</b> 600</li><li><b>C.</b> 400</li><li><b>D.</b> 1,350</li></ul></li>
<li><p>An evaluation set has 50 documents with 10 questions each and a design effect of 3. Which addition narrows the clustered interval most for the same 100 questions?</p><ul><li><b>A.</b> Five samples per question instead of one</li><li><b>B.</b> Dropping the 10 documents with the most failures</li><li><b>C.</b> Two more questions from each existing document</li><li><b>D.</b> 100 more questions from 10 new documents</li></ul></li>
<li><p>At temperature 0.8 a configuration's within-item variance is 0.12 and its between-item variance 0.09. Going from 1 to 4 samples per question on 600 questions does what to the standard error?</p><ul><li><b>A.</b> Reduces it from about 0.0187 to about 0.0141</li><li><b>B.</b> Reduces it to zero, because sampling noise disappears</li><li><b>C.</b> Halves it, because four times the samples is like four times the questions</li><li><b>D.</b> Leaves it unchanged, because samples of one question are not independent</li></ul></li>
<li><p>A permits assistant gives each applicant one answer. Which estimand should the release report use as its primary score?</p><ul><li><b>A.</b> The best of five samples chosen by the grader</li><li><b>B.</b> The mean pass rate per sample</li><li><b>C.</b> pass@5: right in at least one of five samples</li><li><b>D.</b> pass^5: right in all five samples</li></ul></li>
<li><p>Two configurations are compared on four metrics, each tested at 5%. The report headlines whichever metric is significant. If the configurations are in fact identical, how often does such a report find a difference?</p><ul><li><b>A.</b> Exactly 20% of the time, four times 5%</li><li><b>B.</b> About 5% of the time</li><li><b>C.</b> More than 5%, up to about 19% if the metrics were independent</li><li><b>D.</b> Never, because each test controls its own error</li></ul></li>
<li><p>Which plan field, left empty, most directly allows the analyst to change the conclusion after seeing the results?</p><ul><li><b>A.</b> The owner's name</li><li><b>B.</b> The list of secondary metrics</li><li><b>C.</b> The date the evaluation ran</li><li><b>D.</b> The decision rule linking each possible interval to an action</li></ul></li>
</ol>
</section>
<section>
<h2>Day 2: Comparing systems</h2>
<ol>
<li><p>A new task set has 400 questions from 40 documents. The naive standard error of a configuration's score is 0.020 and the clustered one is 0.032. Which should the report use, and what does it imply?</p><ul><li><b>A.</b> The naive one: it is more precise</li><li><b>B.</b> The mean of the two, 0.026</li><li><b>C.</b> Either, if each question was sampled five times</li><li><b>D.</b> The clustered one: the 400 questions are worth about 156 independent ones</li></ul></li>
<li><p>Two configurations answer the same 500 questions. Their scores' intervals overlap heavily. A colleague concludes there is no difference. What is wrong with that?</p><ul><li><b>A.</b> Overlapping separate intervals ignore the correlation; the paired interval of the difference can exclude zero</li><li><b>B.</b> The intervals should have been clustered first</li><li><b>C.</b> Nothing: overlapping intervals mean no difference</li><li><b>D.</b> The difference must be checked against the minimum effect before anything else</li></ul></li>
<li><p>Of six configurations, F has the highest pass rate. After Holm adjustment F is separated from A, B and C, but not from D or E. What may the release note say?</p><ul><li><b>A.</b> F is the best configuration</li><li><b>B.</b> F is the best, because it beats D at the 25% level</li><li><b>C.</b> F, D and E are tied at the top; F is better than A, B and C</li><li><b>D.</b> F, D and E are shown to be equally good</li></ul></li>
<li><p>A pilot of two configurations on 200 shared questions shows a 6-point difference and an SD of per-question differences of 0.25. The decision needs to detect 3 points. Which inputs should the sizing use?</p><ul><li><b>A.</b> The 6-point difference and SD 0.25</li><li><b>B.</b> The 3-point minimum effect and SD 0.25</li><li><b>C.</b> 3 points and the SD of each configuration's scores</li><li><b>D.</b> 200 questions, since the pilot already found a difference</li></ul></li>
<li><p>A new question costs SAR 15 and a sample with its grader call SAR 0.10. At temperature 0.8 within-item variance exceeds between-item variance. Which design is closest to the best at a fixed budget?</p><ul><li><b>A.</b> As many questions as possible, one sample each</li><li><b>B.</b> Few questions, thirty samples each</li><li><b>C.</b> Whatever K, since the grader cost does not enter</li><li><b>D.</b> About ten to fifteen samples per question, the rest on questions</li></ul></li>
<li><p>Two configurations answer the same 600 questions; their per-question scores correlate at 0.8. Compared with an unpaired analysis, the paired standard error of their difference is:</p><ul><li><b>A.</b> Much smaller, because the shared question difficulty cancels</li><li><b>B.</b> Zero, because the same questions were used</li><li><b>C.</b> Larger, because pairing loses degrees of freedom</li><li><b>D.</b> About the same, because the means are the same</li></ul></li>
<li><p>The paired difference is 2.0 points, 95% interval 0.6 to 3.4, and the minimum effect is 3 points. Which verdict follows the plan?</p><ul><li><b>A.</b> Switch: the difference is significant</li><li><b>B.</b> Better, but not shown to be better by the minimum effect</li><li><b>C.</b> No difference shown</li><li><b>D.</b> Worse than the minimum effect, so keep the old configuration as proven better</li></ul></li>
<li><p>Clustering by document widened each configuration's interval by half, but barely changed the paired interval of their difference. Why?</p><ul><li><b>A.</b> The paired analysis uses fewer questions</li><li><b>B.</b> Clustering only applies to single scores by definition</li><li><b>C.</b> The document effect moves both configurations together and cancels in the difference</li><li><b>D.</b> The paired difference is always normally distributed</li></ul></li>
<li><p>Fifteen paired comparisons have smallest p-values 0.001, 0.004 and 0.006. Under Holm at 5%, which are separated?</p><ul><li><b>A.</b> The first two</li><li><b>B.</b> All three</li><li><b>C.</b> None</li><li><b>D.</b> Only the first</li></ul></li>
<li><p>A leaderboard of six configurations lists one rank per row. After Holm adjustment only the last configuration is separated from all others. What should the rank column show?</p><ul><li><b>A.</b> For each configuration, the range of ranks the data cannot rule out</li><li><b>B.</b> Rank 1 for every configuration not separated from the leader</li><li><b>C.</b> The point-estimate ranks, since adjustment applies only to p-values</li><li><b>D.</b> Ranks rounded to the nearest pair</li></ul></li>
<li><p>The SD of per-question paired differences is 0.20. How many shared questions detect a 4-point difference with 80% power at a two-sided 5% level, assuming independence?</p><ul><li><b>A.</b> About 98</li><li><b>B.</b> About 196</li><li><b>C.</b> About 1,960</li><li><b>D.</b> About 50</li></ul></li>
<li><p>A sizing formula gives 400 questions, but a simulation that resamples documents from the pilot shows 62% power at 400. What is the best reading?</p><ul><li><b>A.</b> The simulation is wrong because it is random</li><li><b>B.</b> Use the formula; it is exact</li><li><b>C.</b> An assumption of the formula fails for this data, probably clustering; size up and rerun the simulation</li><li><b>D.</b> Lower the power target to 62%</li></ul></li>
<li><p>A new question costs 100 times a sample, and the within-item variance equals the between-item variance. About how many samples per question minimise the variance at fixed cost?</p><ul><li><b>A.</b> 100</li><li><b>B.</b> As many as the budget allows</li><li><b>C.</b> 1</li><li><b>D.</b> 10</li></ul></li>
</ol>
</section>
<section>
<h2>Day 3: Small sets and imperfect graders</h2>
<ol>
<li><p>D minus C is 2.2 points, paired and clustered 95% interval 0.5 to 3.9, minimum effect 3 points. Dr. Nadeen asks for one sentence. Which is right?</p><ul><li><b>A.</b> D is three points better; switch</li><li><b>B.</b> D is better, but not shown to be better by three points</li><li><b>C.</b> D is better, but by less than three points</li><li><b>D.</b> No difference can be shown</li></ul></li>
<li><p>A new circular yields 25 questions; configuration D passes 24. The report needs a 95% interval for D's pass rate. Which choice is sound?</p><ul><li><b>A.</b> p ± 1.96 √(p(1 − p) / n), the standard formula</li><li><b>B.</b> A bootstrap over the 25 questions</li><li><b>C.</b> A Wilson or Jeffreys interval, or Clopper-Pearson if it supports a safety claim</li><li><b>D.</b> No interval: 25 items are too few to say anything</li></ul></li>
<li><p>A configuration answers 60 safety questions with no unsafe answer. Which statement can the report make at 95% confidence?</p><ul><li><b>A.</b> Its unsafe rate on such questions is below about 5%</li><li><b>B.</b> It never gives unsafe answers on such questions</li><li><b>C.</b> Its unsafe rate is 0% ± 0</li><li><b>D.</b> At most 3 of the next 60 answers will be unsafe</li></ul></li>
<li><p>A grader agrees with people on 92% of 400 verdicts. In Arabic its specificity is 0.70; in English 0.92. What does that do to the pass rates it reports?</p><ul><li><b>A.</b> Nothing: 92% agreement is good enough</li><li><b>B.</b> Arabic pass rates are understated</li><li><b>C.</b> Both languages are biased equally, so comparisons are safe</li><li><b>D.</b> Arabic pass rates are inflated more than English ones, shrinking any language gap</li></ul></li>
<li><p>You corrected an Arabic pass rate with sensitivity and specificity from 150 labelled answers, and built the interval from the test set's clustered standard error only. What is wrong?</p><ul><li><b>A.</b> Nothing: the correction removes the grader's error</li><li><b>B.</b> The interval ignores the uncertainty of sensitivity and specificity, so it is too narrow</li><li><b>C.</b> The calibration set should have been clustered by document too</li><li><b>D.</b> Corrected rates should be reported without intervals</li></ul></li>
<li><p>A 30-question set gives a pass rate of 29/30. Why is the normal-approximation interval a poor choice here?</p><ul><li><b>A.</b> Its estimated variance shrinks near 1, so it is too narrow and can pass 1</li><li><b>B.</b> It assumes the questions are clustered</li><li><b>C.</b> It cannot be computed for fewer than 50 items</li><li><b>D.</b> It is too wide near 1</li></ul></li>
<li><p>In a simulation, an interval method covers the true rate in 87% of evaluations of 40 items at p = 0.95. What does that mean for a report that uses it?</p><ul><li><b>A.</b> Nothing, because coverage averages out over many reports</li><li><b>B.</b> Its 95% intervals are, in effect, 87% intervals at such rates</li><li><b>C.</b> It is 8 points more precise than claimed</li><li><b>D.</b> The pass rates it reports are 8 points too high</li></ul></li>
<li><p>A configuration passes all 100 questions of a safety set. What upper bound on its failure rate can be stated at 95% confidence?</p><ul><li><b>A.</b> 0%</li><li><b>B.</b> About 1%</li><li><b>C.</b> About 3%</li><li><b>D.</b> About 5%</li></ul></li>
<li><p>Two analysts report Beta posterior intervals for 40 out of 40: one with a uniform prior, one with a Jeffreys prior. Their lower ends differ by about 2.6 points. What should the report do?</p><ul><li><b>A.</b> Average the two intervals</li><li><b>B.</b> Use whichever prior gives the higher lower end</li><li><b>C.</b> Drop the Bayesian intervals because they disagree</li><li><b>D.</b> State the prior used, and prefer the more cautious one for a safety claim</li></ul></li>
<li><p>A model grader has specificity 0.70 in Arabic. What does that mean?</p><ul><li><b>A.</b> It passes 30% of answers that people fail</li><li><b>B.</b> It agrees with people on 70% of Arabic verdicts</li><li><b>C.</b> 70% of the answers it passes are right</li><li><b>D.</b> It fails 30% of answers that people pass</li></ul></li>
<li><p>A grader's overall agreement with people is 91%. Its Arabic specificity is 0.73 and English 0.91. Which conclusion is right?</p><ul><li><b>A.</b> The grader is useless and must be replaced</li><li><b>B.</b> Arabic pass rates are inflated more than English ones; correct them by language</li><li><b>C.</b> Only English rates need correcting, since English agreement is higher</li><li><b>D.</b> The grader is reliable; no correction is needed</li></ul></li>
<li><p>The grader passes 70% of a configuration's answers; its sensitivity is 0.90 and specificity 0.80. What is the corrected pass rate?</p><ul><li><b>A.</b> About 78%</li><li><b>B.</b> About 56%</li><li><b>C.</b> About 71%</li><li><b>D.</b> About 63%</li></ul></li>
<li><p>A corrected pass rate's interval was built from the test set's standard error alone. Its sensitivity and specificity came from 120 labelled answers. What does the interval miss?</p><ul><li><b>A.</b> The bias from the correction itself</li><li><b>B.</b> Nothing, if the test set is large</li><li><b>C.</b> The clustering of the calibration set by grader</li><li><b>D.</b> The uncertainty in sensitivity and specificity, which a joint bootstrap or delta method adds</li></ul></li>
</ol>
</section>
<section>
<h2>Day 4: Auditing claims and setting standards</h2>
<ol>
<li><p>A grader's Arabic specificity is 0.73, from 49 human-failed answers. A team corrects an Arabic pass rate and reports an interval from the test set alone. What should the reviewer ask for?</p><ul><li><b>A.</b> Nothing: the corrected rate is unbiased</li><li><b>B.</b> A Clopper-Pearson interval on the test set</li><li><b>C.</b> An interval that also resamples the calibration verdicts</li><li><b>D.</b> The uncorrected rate, which has a narrower interval</li></ul></li>
<li><p>A report compares two configurations. One was scored as the best of five samples and tuned on 12 prompt variants using the test questions; the other as the mean of five, untuned. What must the audit do first?</p><ul><li><b>A.</b> Rescore both the same way and remove the test questions used in tuning before comparing</li><li><b>B.</b> Add confidence intervals to the reported numbers</li><li><b>C.</b> Ask for more test questions</li><li><b>D.</b> Accept it: the tuned configuration earned its lead</li></ul></li>
<li><p>A report claims "the assistant is equally accurate for all regions". The logs carry no region field. How should the audit class the claim?</p><ul><li><b>A.</b> Supported: no regional difference was found</li><li><b>B.</b> Unsupported: equal accuracy is unlikely</li><li><b>C.</b> Supported, because regions should not matter for regulations</li><li><b>D.</b> Untestable with these logs; name the data that would test it</li></ul></li>
<li><p>C's Arabic interval is 63.8 to 74.6 and its English interval 69.3 to 80.8. They overlap. Most documents have questions in both languages. What can you conclude about the gap?</p><ul><li><b>A.</b> No gap: the intervals overlap</li><li><b>B.</b> Nothing yet: test the gap itself with a standard error clustered by document</li><li><b>C.</b> Compute the gap's SE as the root sum of the two squared SEs</li><li><b>D.</b> Report both rates; gaps are never tested</li></ul></li>
<li><p>A team's report has intervals, a plan and slices, but scores its own configuration as the best of five samples and the vendor's as the mean of five. Which field of the standard catches it?</p><ul><li><b>A.</b> multiplicity</li><li><b>B.</b> slices</li><li><b>C.</b> budget_parity, with the estimand stated per configuration</li><li><b>D.</b> interval_method</li></ul></li>
<li><p>48 test questions appear among the examples used to tune configuration D. On them D scores 90%; on the other questions 73%. Configurations A, B and C score the same on both groups. What follows?</p><ul><li><b>A.</b> D's lead comes partly from the overlap; compare on clean questions</li><li><b>B.</b> D is better at hard questions</li><li><b>C.</b> The overlap does not matter because it is under 10% of the set</li><li><b>D.</b> The 48 questions are easier and should be dropped for every configuration</li></ul></li>
<li><p>An overlap check by exact string match finds 8 Arabic test questions in the tuning examples; after folding hamza forms, ta marbuta, alef maqsura and diacritics it finds 21. Which count should the audit use?</p><ul><li><b>A.</b> The average, about 15</li><li><b>B.</b> 21, because spelling variants of the same question carry the same answer</li><li><b>C.</b> Neither: Arabic overlap cannot be measured</li><li><b>D.</b> 8, because only identical strings are contamination</li></ul></li>
<li><p>Configuration X is reported as pass@5 (best of five) and Y as the mean of five samples. X leads by 15 points. What is the fair comparison?</p><ul><li><b>A.</b> Compare X's best sample with Y's best sample on one question</li><li><b>B.</b> Keep the reported numbers; both used five samples</li><li><b>C.</b> Compare X's mean of five with Y's mean of five, or both at pass@5</li><li><b>D.</b> Halve X's lead to correct for the extra samples</li></ul></li>
<li><p>A report claims a configuration 'will perform as well next year'. The authority has no data from next year's questions. How should the audit class it?</p><ul><li><b>A.</b> Supported, if the configuration ranks first</li><li><b>B.</b> Supported, if this year's interval is narrow</li><li><b>C.</b> Unsupported, because performance always drifts</li><li><b>D.</b> Untestable with the data held; name the evaluation that would test it</li></ul></li>
<li><p>A claim says 'B is better than A'. The paired, clustered difference is 6.6 points, 95% interval 4.5 to 8.8. How should the audit class it?</p><ul><li><b>A.</b> Supported: the interval of the difference excludes zero</li><li><b>B.</b> Unsupported: 6.6 points is small</li><li><b>C.</b> Untestable: A and B are different models</li><li><b>D.</b> Unsupported: the intervals of A and B overlap</li></ul></li>
<li><p>Two language slices share 80 documents. Why is the standard error of the gap computed with document clustering rather than as √(SE_ar² + SE_en²)?</p><ul><li><b>A.</b> Because the Arabic slice is larger</li><li><b>B.</b> Because a hard document lowers both languages, so the slices are correlated</li><li><b>C.</b> Because clustering always gives a smaller standard error</li><li><b>D.</b> Because the gap is a ratio, not a difference</li></ul></li>
<li><p>After grader correction, C's Arabic minus English gap moves from −5.8 to −9.0 points, but its interval widens to −22.2 to +2.4. What should the report say?</p><ul><li><b>A.</b> There is no language gap, since the corrected interval includes zero</li><li><b>B.</b> Report only the observed gap, which is significant</li><li><b>C.</b> The best estimate of the gap is larger than observed; more Arabic labels are needed to pin it down</li><li><b>D.</b> Average the observed and corrected gaps</li></ul></li>
<li><p>Which field of an evaluation reporting standard would have stopped a headline that compared one configuration's best of five samples with another's mean of five?</p><ul><li><b>A.</b> slices</li><li><b>B.</b> interval_method</li><li><b>C.</b> multiplicity</li><li><b>D.</b> budget_parity, with the estimand stated per configuration</li></ul></li>
<li><p>A team proposes making results by language optional in the reporting standard 'to keep reports short'. What is the strongest reason to keep them required?</p><ul><li><b>A.</b> An average can hide a configuration that serves one language worse, and graders can err unequally by language</li><li><b>B.</b> Regulators ask for two numbers</li><li><b>C.</b> Slices make every interval narrower</li><li><b>D.</b> Arabic results are always lower</li></ul></li>
</ol>
</section>

tle":"Paired designs"},{"n":2,"label":"Session 2","title":"Many configurations"},{"n":3,"label":"Session 3","title":"Sizing an evaluation"},{"n":4,"label":"Session 4","title":"Spending the budget"}]},{"n":3,"id":"day3","label":"Day 3","title":"Small sets and imperfect graders","sessions":[{"n":1,"label":"Session 1","title":"Where large-sample intervals fail"},{"n":2,"label":"Session 2","title":"Exact and Bayesian intervals"},{"n":3,"label":"Session 3","title":"Graders against people"},{"n":4,"label":"Session 4","title":"Correcting for grader error"}]},{"n":4,"id":"day4","label":"Day 4","title":"Auditing claims and setting standards","sessions":[{"n":1,"label":"Session 1","title":"Contamination and unequal budgets"},{"n":2,"label":"Session 2","title":"Auditing a report"},{"n":3,"label":"Session 3","title":"Slicing by language"},{"n":4,"label":"Session 4","title":"A reporting standard"}]},{"n":5,"id":"capstone","label":"Capstone","title":"Capstone project presentations","sessions":[]}]},"ai":{"context":{"course":"context/course.md","courseJs":"context/course.js","day":null,"llms":"llms.txt"},"tasks":[],"tools":[]},"features":{},"strings":{},"questions":[{"id":"check-sample-q1","type":"single","prompt":"Configuration B scores 69.8% on the 600 questions, 95% interval 66.7% to 72.9%. A manager asks what the interval means. Which answer is right?","options":[{"key":"A","text":"B passes between 66.7% and 72.9% of these 600 questions"},{"key":"B","text":"B's pass rate on questions written the same way is plausibly between 66.7% and 72.9%"},{"key":"C","text":"Each answer of B passes with a probability between 66.7% and 72.9%"},{"key":"D","text":"B will score between 66.7% and 72.9% on next year's regulations"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The interval estimates the pass rate on the population the questions were sampled from; on the sample itself there is no uncertainty, and other populations are not covered.","misconceptions":["Treats the 600 questions as the population: on them the rate is known exactly","","Reads the interval as a range of individual answers, not of a rate","Assumes the interval covers any population, including questions of a different kind"],"lo":["LO1"],"day":1,"session":1,"slide":{"deck":"day1","id":"check-sample","title":"What does the interval describe?"},"level":null,"pool":"checkpoint"},{"id":"check-clusters-q1","type":"single","prompt":"C's design effect is 2.5. Furat can pay for 160 more questions. Which plan narrows C's clustered interval most?","options":[{"key":"A","text":"160 questions from the same 80 documents, two per document"},{"key":"B","text":"Ten samples per question in place of five"},{"key":"C","text":"160 questions from 20 new documents"},{"key":"D","text":"Report the naive interval, which is already narrower"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The clustered standard error falls with the number of documents; new documents add independent evidence that more questions from old documents do not.","misconceptions":["Treats questions as independent: more questions from the same documents carry the same document effects","Confuses sampling noise with clustering: more samples shrink the within-item part only","","Believes the naive formula is the safer report: it is narrower because it is wrong"],"lo":["LO1"],"day":1,"session":2,"slide":{"deck":"day1","id":"check-clusters","title":"Which change narrows the interval most?"},"level":null,"pool":"checkpoint"},{"id":"check-samples-q1","type":"single","prompt":"At temperature 0.2, D's between-item variance is 0.123 and its within-item variance 0.068. A colleague proposes 20 samples per question in place of 5 to \"make the score precise\". What happens?","options":[{"key":"A","text":"The standard error barely falls, because the between-item part does not shrink with samples"},{"key":"B","text":"The standard error halves, as it would with four times the questions"},{"key":"C","text":"The pass rate rises, because more samples find more right answers"},{"key":"D","text":"The score becomes pass@20, which is the right metric at last"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"More samples reduce only the within / K term; the between-item term, 0.123 here, stays, so the SE goes from 0.0151 to 0.0145.","misconceptions":["","Treats samples as independent questions: they share the question's difficulty","Confuses precision with bias: more samples change the noise, not the expected score","Mistakes pass@k for the mean: the mean is unchanged in expectation"],"lo":["LO1"],"day":1,"session":3,"slide":{"deck":"day1","id":"check-samples","title":"Twenty samples per question"},"level":null,"pool":"checkpoint"},{"id":"check-plan-q1","type":"single","prompt":"The plan named the mean pass rate. After the run, D beats C on pass@5 but not on the mean. The team wants to headline pass@5 \"because it shows D's potential\". What should the report do?","options":[{"key":"A","text":"Headline pass@5, since it is a recognised metric"},{"key":"B","text":"Headline pass@5 with alpha lowered to 0.01"},{"key":"C","text":"Delete pass@5 from the report entirely"},{"key":"D","text":"Headline the planned mean and label pass@5 as an unplanned, exploratory result"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The planned metric carries the stated error rate; an outcome chosen because it won does not, so it can be shown only as exploratory.","misconceptions":["Treats any defensible metric as equal once results are known: that is the forking path","Believes a lower alpha repairs a post hoc choice: it does not undo the selection","Thinks a plan forbids any other result: secondary results are allowed when labelled",""],"lo":["LO2"],"day":1,"session":4,"slide":{"deck":"day1","id":"check-plan","title":"The metric changed after the results"},"level":null,"pool":"checkpoint"},{"id":"review-day1-q1","type":"single","prompt":"A new task set has 400 questions from 40 documents. The naive standard error of a configuration's score is 0.020 and the clustered one is 0.032. Which should the report use, and what does it imply?","options":[{"key":"A","text":"The naive one: it is more precise"},{"key":"B","text":"The mean of the two, 0.026"},{"key":"C","text":"Either, if each question was sampled five times"},{"key":"D","text":"The clustered one: the 400 questions are worth about 156 independent ones"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Questions from one document share its difficulty; DEFF = (0.032 / 0.020)² = 2.56, so 400 / 2.56 ≈ 156.","misconceptions":["Thinks the narrower interval is the more precise one, when it is narrower only because it ignores clustering","Averages two estimates as if both were valid","Believes repeated samples fix clustering, which comes from documents, not draws",""],"lo":["LO1"],"day":2,"session":null,"slide":{"deck":"day2","id":"review-day1","title":"Which standard error belongs in the report?"},"level":null,"pool":"checkpoint"},{"id":"check-paired-q1","type":"single","prompt":"Two configurations answer the same 500 questions. Their scores' intervals overlap heavily. A colleague concludes there is no difference. What is wrong with that?","options":[{"key":"A","text":"Overlapping separate intervals ignore the correlation; the paired interval of the difference can exclude zero"},{"key":"B","text":"The intervals should have been clustered first"},{"key":"C","text":"Nothing: overlapping intervals mean no difference"},{"key":"D","text":"The difference must be checked against the minimum effect before anything else"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Shared questions make the scores correlated; the variance of their difference subtracts twice the covariance, so the paired interval is much narrower than the overlap suggests.","misconceptions":["","Thinks clustering is the missing piece, when it barely changes a paired difference","Believes overlap is always conclusive, which is true only for independent samples, and then only roughly","Confuses the size of the effect with the evidence for it"],"lo":["LO2"],"day":2,"session":1,"slide":{"deck":"day2","id":"check-paired","title":"Two configurations on the same questions"},"level":null,"pool":"checkpoint"},{"id":"check-ranking-q1","type":"single","prompt":"Of six configurations, F has the highest pass rate. After Holm adjustment F is separated from A, B and C, but not from D or E. What may the release note say?","options":[{"key":"A","text":"F is the best configuration"},{"key":"B","text":"F is the best, because it beats D at the 25% level"},{"key":"C","text":"F, D and E are tied at the top; F is better than A, B and C"},{"key":"D","text":"F, D and E are shown to be equally good"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The adjusted analysis separates F from three configurations only; between F, D and E the data cannot tell, which is a tie in the evidence, not a proof of equality.","misconceptions":["Reads the highest point estimate as a shown ranking","Uses unadjusted tests after looking at fifteen pairs","","Confuses not separated with shown to be equal"],"lo":["LO2"],"day":2,"session":2,"slide":{"deck":"day2","id":"check-ranking","title":"Announcing a winner"},"level":null,"pool":"checkpoint"},{"id":"check-sizing-q1","type":"single","prompt":"A pilot of two configurations on 200 shared questions shows a 6-point difference and an SD of per-question differences of 0.25. The decision needs to detect 3 points. Which inputs should the sizing use?","options":[{"key":"A","text":"The 6-point difference and SD 0.25"},{"key":"B","text":"The 3-point minimum effect and SD 0.25"},{"key":"C","text":"3 points and the SD of each configuration's scores"},{"key":"D","text":"200 questions, since the pilot already found a difference"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The effect to detect comes from the decision, the noise from the pilot; the pilot's observed difference is itself uncertain and would undersize the study.","misconceptions":["Sizes for the pilot's lucky draw instead of the effect that matters","","Uses each score's spread, which ignores the pairing","Thinks the pilot's own n settles the question"],"lo":["LO3"],"day":2,"session":3,"slide":{"deck":"day2","id":"check-sizing","title":"Sizing from a pilot"},"level":null,"pool":"checkpoint"},{"id":"check-budget-q1","type":"single","prompt":"A new question costs SAR 15 and a sample with its grader call SAR 0.10. At temperature 0.8 within-item variance exceeds between-item variance. Which design is closest to the best at a fixed budget?","options":[{"key":"A","text":"As many questions as possible, one sample each"},{"key":"B","text":"Few questions, thirty samples each"},{"key":"C","text":"Whatever K, since the grader cost does not enter"},{"key":"D","text":"About ten to fifteen samples per question, the rest on questions"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"K* = √((15 / 0.10) × within / between) is above 12 when within exceeds between; the optimum is flat around it.","misconceptions":["Thinks only questions reduce variance, ignoring that sampling noise is the larger part here","Thinks cheap samples are always the answer, ignoring the between-item floor","Believes the cost of grading does not affect the choice",""],"lo":["LO3"],"day":2,"session":4,"slide":{"deck":"day2","id":"check-budget","title":"Spending the next SAR 6,000"},"level":null,"pool":"checkpoint"},{"id":"review-day2-q1","type":"single","prompt":"D minus C is 2.2 points, paired and clustered 95% interval 0.5 to 3.9, minimum effect 3 points. Dr. Nadeen asks for one sentence. Which is right?","options":[{"key":"A","text":"D is three points better; switch"},{"key":"B","text":"D is better, but not shown to be better by three points"},{"key":"C","text":"D is better, but by less than three points"},{"key":"D","text":"No difference can be shown"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The interval excludes zero, so D is better; it includes values both below and above 3, so whether the gain reaches the minimum effect is not shown.","misconceptions":["Reads significance as importance: the interval includes values below the threshold","","Reads an interval that includes 3 as proof of an effect below 3","Uses the unpaired interval, which ignores that the questions are shared"],"lo":["LO2"],"day":3,"session":null,"slide":{"deck":"day3","id":"review-day2","title":"What the paired interval allows you to say"},"level":null,"pool":"checkpoint"},{"id":"check-coverage-q1","type":"single","prompt":"A new circular yields 25 questions; configuration D passes 24. The report needs a 95% interval for D's pass rate. Which choice is sound?","options":[{"key":"A","text":"p ± 1.96 √(p(1 − p) / n), the standard formula"},{"key":"B","text":"A bootstrap over the 25 questions"},{"key":"C","text":"A Wilson or Jeffreys interval, or Clopper-Pearson if it supports a safety claim"},{"key":"D","text":"No interval: 25 items are too few to say anything"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"With few items near 1, Wald and the percentile bootstrap are too narrow; Wilson and Jeffreys keep close to 95%, Clopper-Pearson at least 95%.","misconceptions":["Applies the large-sample formula where the lab showed it under-covers badly","Thinks a bootstrap fixes small samples; with 24 of 25 it inherits the same collapse","","Believes small sets cannot be reported at all, when an honest wide interval is informative"],"lo":["LO1"],"day":3,"session":1,"slide":{"deck":"day3","id":"check-coverage","title":"Choosing an interval for a small set"},"level":null,"pool":"checkpoint"},{"id":"check-safety-q1","type":"single","prompt":"A configuration answers 60 safety questions with no unsafe answer. Which statement can the report make at 95% confidence?","options":[{"key":"A","text":"Its unsafe rate on such questions is below about 5%"},{"key":"B","text":"It never gives unsafe answers on such questions"},{"key":"C","text":"Its unsafe rate is 0% ± 0"},{"key":"D","text":"At most 3 of the next 60 answers will be unsafe"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"With zero failures in n, the one-sided 95% upper bound on the failure rate is 1 − 0.051/n, about 3 / n: 4.9% for n = 60.","misconceptions":["","Turns zero observed failures into a claim of zero failures","Uses the Wald interval, which collapses to a point at 60 of 60","Confuses the bound for the rate with a bound on a count of future failures"],"lo":["LO1"],"day":3,"session":2,"slide":{"deck":"day3","id":"check-safety","title":"Zero failures"},"level":null,"pool":"checkpoint"},{"id":"check-grader-q1","type":"single","prompt":"A grader agrees with people on 92% of 400 verdicts. In Arabic its specificity is 0.70; in English 0.92. What does that do to the pass rates it reports?","options":[{"key":"A","text":"Nothing: 92% agreement is good enough"},{"key":"B","text":"Arabic pass rates are understated"},{"key":"C","text":"Both languages are biased equally, so comparisons are safe"},{"key":"D","text":"Arabic pass rates are inflated more than English ones, shrinking any language gap"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Low specificity means bad answers are passed; more of them pass in Arabic, so Arabic rates rise more and a real Arabic weakness looks smaller.","misconceptions":["Thinks high overall agreement makes the error rates irrelevant","Confuses specificity with sensitivity: low specificity passes bad answers, it does not fail good ones","Assumes errors in both directions cancel, which needs equal rates in both languages",""],"lo":["LO4"],"day":3,"session":3,"slide":{"deck":"day3","id":"check-grader","title":"Reading a grader report"},"level":null,"pool":"checkpoint"},{"id":"check-correction-q1","type":"single","prompt":"You corrected an Arabic pass rate with sensitivity and specificity from 150 labelled answers, and built the interval from the test set's clustered standard error only. What is wrong?","options":[{"key":"A","text":"Nothing: the correction removes the grader's error"},{"key":"B","text":"The interval ignores the uncertainty of sensitivity and specificity, so it is too narrow"},{"key":"C","text":"The calibration set should have been clustered by document too"},{"key":"D","text":"Corrected rates should be reported without intervals"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Sensitivity and specificity are estimates from a small labelled set; resampling it with the test set carries that uncertainty into the corrected rate's interval.","misconceptions":["Thinks correction removes uncertainty instead of adding it","","Confuses which set needs clustering: the calibration verdicts are separate answers","Believes a corrected rate cannot have an interval at all"],"lo":["LO4"],"day":3,"session":4,"slide":{"deck":"day3","id":"check-correction","title":"An interval for a corrected rate"},"level":null,"pool":"checkpoint"},{"id":"review-day3-q1","type":"single","prompt":"A grader's Arabic specificity is 0.73, from 49 human-failed answers. A team corrects an Arabic pass rate and reports an interval from the test set alone. What should the reviewer ask for?","options":[{"key":"A","text":"Nothing: the corrected rate is unbiased"},{"key":"B","text":"A Clopper-Pearson interval on the test set"},{"key":"C","text":"An interval that also resamples the calibration verdicts"},{"key":"D","text":"The uncorrected rate, which has a narrower interval"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Sensitivity and specificity are estimates from a small labelled set; their uncertainty belongs in the corrected rate's interval.","misconceptions":["Thinks the correction makes the grader exact","Applies the small-set rule to the wrong quantity: the test set has hundreds of items","","Removes the correction instead of measuring its uncertainty"],"lo":["LO4"],"day":4,"session":null,"slide":{"deck":"day4","id":"review-day3","title":"A grader, a small set, and an interval"},"level":null,"pool":"checkpoint"},{"id":"check-budgets-q1","type":"single","prompt":"A report compares two configurations. One was scored as the best of five samples and tuned on 12 prompt variants using the test questions; the other as the mean of five, untuned. What must the audit do first?","options":[{"key":"A","text":"Rescore both the same way and remove the test questions used in tuning before comparing"},{"key":"B","text":"Add confidence intervals to the reported numbers"},{"key":"C","text":"Ask for more test questions"},{"key":"D","text":"Accept it: the tuned configuration earned its lead"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Unequal scoring and tuning on the test set are biases, not noise; only an equal-budget comparison on clean questions measures the configurations rather than the procedure.","misconceptions":["","Thinks an interval fixes a biased comparison; it only measures noise","Thinks a larger test set dilutes a bias that comes from how it was scored","Reads tuning on the test set as legitimate effort"],"lo":["LO5"],"day":4,"session":1,"slide":{"deck":"day4","id":"check-budgets","title":"A fair comparison"},"level":null,"pool":"checkpoint"},{"id":"check-audit-q1","type":"single","prompt":"A report claims \"the assistant is equally accurate for all regions\". The logs carry no region field. How should the audit class the claim?","options":[{"key":"A","text":"Supported: no regional difference was found"},{"key":"B","text":"Unsupported: equal accuracy is unlikely"},{"key":"C","text":"Supported, because regions should not matter for regulations"},{"key":"D","text":"Untestable with these logs; name the data that would test it"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Without a region field no analysis of these logs can decide the claim; the memo says what data would.","misconceptions":["Reads absence of evidence against the claim as evidence for it","Treats a claim the data cannot address as contradicted by them","Thinks a claim can be classed by the auditor's prior belief",""],"lo":["LO5"],"day":4,"session":2,"slide":{"deck":"day4","id":"check-audit","title":"Classing a claim"},"level":null,"pool":"checkpoint"},{"id":"check-slices-q1","type":"single","prompt":"C's Arabic interval is 63.8 to 74.6 and its English interval 69.3 to 80.8. They overlap. Most documents have questions in both languages. What can you conclude about the gap?","options":[{"key":"A","text":"No gap: the intervals overlap"},{"key":"B","text":"Nothing yet: test the gap itself with a standard error clustered by document"},{"key":"C","text":"Compute the gap's SE as the root sum of the two squared SEs"},{"key":"D","text":"Report both rates; gaps are never tested"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Two slices that share documents are correlated; only an interval for the gap itself, clustered by document, says whether the gap is real.","misconceptions":["Uses overlap as a test, which Day 2 showed ignores the shared structure","","Treats the two slices as independent, when they share documents","Thinks slices are only descriptive and never tested"],"lo":["LO6"],"day":4,"session":3,"slide":{"deck":"day4","id":"check-slices","title":"Two overlapping intervals"},"level":null,"pool":"checkpoint"},{"id":"check-standard-q1","type":"single","prompt":"A team's report has intervals, a plan and slices, but scores its own configuration as the best of five samples and the vendor's as the mean of five. Which field of the standard catches it?","options":[{"key":"A","text":"multiplicity"},{"key":"B","text":"slices"},{"key":"C","text":"budget_parity, with the estimand stated per configuration"},{"key":"D","text":"interval_method"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Budget parity requires every configuration to be scored and tuned the same way; a stated estimand makes the difference visible.","misconceptions":["Multiplicity concerns how many comparisons, not how each was scored","Slices check groups of questions, not scoring rules","","The interval method governs uncertainty, not the comparability of the scores"],"lo":["LO6"],"day":4,"session":4,"slide":{"deck":"day4","id":"check-standard","title":"The field that matters"},"level":null,"pool":"checkpoint"},{"id":"d1-population","type":"single","prompt":"An evaluation of a permits assistant reports 81% on 400 questions, 95% interval 77% to 85%. Which statement about the interval is correct?","options":[{"key":"A","text":"It is a plausible range for the pass rate on new questions written the same way"},{"key":"B","text":"It is the range of pass rates the assistant will reach next year"},{"key":"C","text":"It is the range within which 95% of individual answers fall"},{"key":"D","text":"It is the range of pass rates on these 400 questions if the evaluation were rerun with the same answers"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The interval estimates the pass rate on the population the questions were sampled from.","misconceptions":["","Extends the interval to a different population and time","Confuses an interval for a rate with a range of single outcomes","Treats the fixed sample as uncertain: on these questions with these answers the rate is known"],"lo":["LO1"],"day":1,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"d1-se-by-hand","type":"single","prompt":"A configuration passes 270 of 300 independent questions. What is the formula standard error of its pass rate, to two significant figures?","options":[{"key":"A","text":"0.090"},{"key":"B","text":"0.017"},{"key":"C","text":"0.30"},{"key":"D","text":"0.0010"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"p = 0.9, so SE = sqrt(0.9 × 0.1 / 300) = sqrt(0.0003) ≈ 0.017.","misconceptions":["Reports p(1 − p) without dividing by n or taking the root","","Uses the number of failures as the standard error","Forgets the square root: 0.09 / 300 = 0.0003, then divides again"],"lo":["LO1"],"day":1,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"d1-deff","type":"single","prompt":"A clustered standard error is 0.030 and the naive one is 0.020 on 900 questions. How many independent questions are the 900 worth?","options":[{"key":"A","text":"2,025"},{"key":"B","text":"600"},{"key":"C","text":"400"},{"key":"D","text":"1,350"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"DEFF = (0.030 / 0.020)² = 2.25, and 900 / 2.25 = 400.","misconceptions":["Multiplies by the design effect instead of dividing","Uses the ratio of standard errors, 1.5, instead of its square","","Multiplies by the ratio instead of dividing"],"lo":["LO1"],"day":1,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"d1-more-docs","type":"single","prompt":"An evaluation set has 50 documents with 10 questions each and a design effect of 3. Which addition narrows the clustered interval most for the same 100 questions?","options":[{"key":"A","text":"Five samples per question instead of one"},{"key":"B","text":"Dropping the 10 documents with the most failures"},{"key":"C","text":"Two more questions from each existing document"},{"key":"D","text":"100 more questions from 10 new documents"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The clustered standard error falls with the number of independent clusters; new documents add them.","misconceptions":["Confuses within-question sampling noise with between-document clustering","Removes data selectively, which biases the score","Treats extra questions from the same document as independent evidence",""],"lo":["LO1","LO3"],"day":1,"session":2,"slide":null,"level":"analyze","pool":"practice"},{"id":"d1-samples","type":"single","prompt":"At temperature 0.8 a configuration's within-item variance is 0.12 and its between-item variance 0.09. Going from 1 to 4 samples per question on 600 questions does what to the standard error?","options":[{"key":"A","text":"Reduces it from about 0.0187 to about 0.0141"},{"key":"B","text":"Reduces it to zero, because sampling noise disappears"},{"key":"C","text":"Halves it, because four times the samples is like four times the questions"},{"key":"D","text":"Leaves it unchanged, because samples of one question are not independent"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"SE = sqrt((0.09 + 0.12 / K) / 600): 0.0187 for K = 1 and 0.0141 for K = 4.","misconceptions":["","Forgets the between-item part, which more samples do not reduce","Treats samples as if they were new questions","Thinks repeated samples add no information at all"],"lo":["LO1"],"day":1,"session":3,"slide":null,"level":"analyze","pool":"practice"},{"id":"d1-pass-at-k","type":"single","prompt":"A permits assistant gives each applicant one answer. Which estimand should the release report use as its primary score?","options":[{"key":"A","text":"The best of five samples chosen by the grader"},{"key":"B","text":"The mean pass rate per sample"},{"key":"C","text":"pass@5: right in at least one of five samples"},{"key":"D","text":"pass^5: right in all five samples"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"An applicant sees one answer, so the expected pass rate of a single sample is the quantity that matters.","misconceptions":["Lets the grader choose after the fact, which no applicant can do","","Describes a user who can retry and pick the right answer","Describes a stricter, consistency requirement rather than the single answer"],"lo":["LO1"],"day":1,"session":3,"slide":null,"level":"understand","pool":"practice"},{"id":"d1-forking","type":"single","prompt":"Two configurations are compared on four metrics, each tested at 5%. The report headlines whichever metric is significant. If the configurations are in fact identical, how often does such a report find a difference?","options":[{"key":"A","text":"Exactly 20% of the time, four times 5%"},{"key":"B","text":"About 5% of the time"},{"key":"C","text":"More than 5%, up to about 19% if the metrics were independent"},{"key":"D","text":"Never, because each test controls its own error"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Choosing the best of several tests after the results raises the chance of at least one false win; correlated metrics give a little less than 1 − 0.95⁴.","misconceptions":["Adds the rates instead of combining them, and ignores correlation","Assumes the per-test error rate survives selection","","Confuses per-test control with control of the whole study"],"lo":["LO2","LO6"],"day":1,"session":4,"slide":null,"level":"evaluate","pool":"practice"},{"id":"d1-plan","type":"single","prompt":"Which plan field, left empty, most directly allows the analyst to change the conclusion after seeing the results?","options":[{"key":"A","text":"The owner's name"},{"key":"B","text":"The list of secondary metrics"},{"key":"C","text":"The date the evaluation ran"},{"key":"D","text":"The decision rule linking each possible interval to an action"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Without a decision rule written in advance, any interval can be read as supporting the preferred action.","misconceptions":["Names who is accountable but does not fix any analysis choice","Secondary results are labelled exploratory anyway","The run date is recorded by the logs and does not drive a conclusion",""],"lo":["LO6"],"day":1,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"d2-paired-why","type":"single","prompt":"Two configurations answer the same 600 questions; their per-question scores correlate at 0.8. Compared with an unpaired analysis, the paired standard error of their difference is:","options":[{"key":"A","text":"Much smaller, because the shared question difficulty cancels"},{"key":"B","text":"Zero, because the same questions were used"},{"key":"C","text":"Larger, because pairing loses degrees of freedom"},{"key":"D","text":"About the same, because the means are the same"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Var(D − C) = Var(D) + Var(C) − 2 Cov(C, D); a strong positive correlation removes most of the variance.","misconceptions":["","Thinks shared questions remove all noise, when per-question differences still vary","Overweights the loss of degrees of freedom, which is negligible with hundreds of questions","Confuses the point estimate, which is the same, with its precision"],"lo":["LO2"],"day":2,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"d2-verdict","type":"single","prompt":"The paired difference is 2.0 points, 95% interval 0.6 to 3.4, and the minimum effect is 3 points. Which verdict follows the plan?","options":[{"key":"A","text":"Switch: the difference is significant"},{"key":"B","text":"Better, but not shown to be better by the minimum effect"},{"key":"C","text":"No difference shown"},{"key":"D","text":"Worse than the minimum effect, so keep the old configuration as proven better"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The interval excludes zero but includes values below 3 points, so the gain is real but not shown to reach the threshold.","misconceptions":["Treats statistical significance as practical importance","","Ignores that the whole interval is above zero","Reads an interval that includes 3 as proof the effect is below 3"],"lo":["LO2"],"day":2,"session":1,"slide":null,"level":"evaluate","pool":"practice"},{"id":"d2-cluster-paired","type":"single","prompt":"Clustering by document widened each configuration's interval by half, but barely changed the paired interval of their difference. Why?","options":[{"key":"A","text":"The paired analysis uses fewer questions"},{"key":"B","text":"Clustering only applies to single scores by definition"},{"key":"C","text":"The document effect moves both configurations together and cancels in the difference"},{"key":"D","text":"The paired difference is always normally distributed"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A shared document effect raises or lowers both scores, so it drops out of D minus C.","misconceptions":["Pairing uses the same questions, not fewer","Clustering applies to any statistic; it just may not matter","","Normality has nothing to do with whether clustering matters"],"lo":["LO1","LO2"],"day":2,"session":1,"slide":null,"level":"analyze","pool":"practice"},{"id":"d2-holm","type":"single","prompt":"Fifteen paired comparisons have smallest p-values 0.001, 0.004 and 0.006. Under Holm at 5%, which are separated?","options":[{"key":"A","text":"The first two"},{"key":"B","text":"All three"},{"key":"C","text":"None"},{"key":"D","text":"Only the first"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Holm compares 0.001 with 0.05/15 = 0.0033 (separated), then 0.004 with 0.05/14 = 0.0036 (fails) and stops.","misconceptions":["Compares 0.004 with 0.05/13 or with 0.05 over its rank from the top, not with 0.05/14","Uses unadjusted 5% thresholds for every comparison","Thinks Bonferroni's threshold of 0.0033 rejects nothing, though 0.001 is below it",""],"lo":["LO2"],"day":2,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"d2-ranks","type":"single","prompt":"A leaderboard of six configurations lists one rank per row. After Holm adjustment only the last configuration is separated from all others. What should the rank column show?","options":[{"key":"A","text":"For each configuration, the range of ranks the data cannot rule out"},{"key":"B","text":"Rank 1 for every configuration not separated from the leader"},{"key":"C","text":"The point-estimate ranks, since adjustment applies only to p-values"},{"key":"D","text":"Ranks rounded to the nearest pair"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Plausible rank ranges state what the adjusted comparisons support; single ranks claim separations that were not shown.","misconceptions":["","Treats not separated as tied for first, ignoring separations among the others","Thinks ranks are exempt from uncertainty","Invents a rounding with no statistical basis"],"lo":["LO2"],"day":2,"session":2,"slide":null,"level":"evaluate","pool":"practice"},{"id":"d2-size","type":"single","prompt":"The SD of per-question paired differences is 0.20. How many shared questions detect a 4-point difference with 80% power at a two-sided 5% level, assuming independence?","options":[{"key":"A","text":"About 98"},{"key":"B","text":"About 196"},{"key":"C","text":"About 1,960"},{"key":"D","text":"About 50"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"n = (1.96 + 0.84)² × 0.20² / 0.04² = 7.84 × 0.04 / 0.0016 = 196.","misconceptions":["Halves the answer by using one z value only","","Forgets to square the effect in the denominator correctly","Uses the effect instead of its square"],"lo":["LO3"],"day":2,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"d2-sim","type":"single","prompt":"A sizing formula gives 400 questions, but a simulation that resamples documents from the pilot shows 62% power at 400. What is the best reading?","options":[{"key":"A","text":"The simulation is wrong because it is random"},{"key":"B","text":"Use the formula; it is exact"},{"key":"C","text":"An assumption of the formula fails for this data, probably clustering; size up and rerun the simulation"},{"key":"D","text":"Lower the power target to 62%"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The simulation keeps the real cluster structure and the planned test; when it disagrees, the formula's assumptions are the suspect.","misconceptions":["Mistakes Monte Carlo noise, which is small with enough draws, for bias","Trusts assumptions over the data's own structure","","Changes the requirement to fit the plan"],"lo":["LO3"],"day":2,"session":3,"slide":null,"level":"analyze","pool":"practice"},{"id":"d2-budget","type":"single","prompt":"A new question costs 100 times a sample, and the within-item variance equals the between-item variance. About how many samples per question minimise the variance at fixed cost?","options":[{"key":"A","text":"100"},{"key":"B","text":"As many as the budget allows"},{"key":"C","text":"1"},{"key":"D","text":"10"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"K* = √(100 × 1) = 10.","misconceptions":["Uses the cost ratio without the square root","Ignores the between-item floor that samples cannot reduce","Spends everything on questions, ignoring sampling noise",""],"lo":["LO3"],"day":2,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"d3-wald-edge","type":"single","prompt":"A 30-question set gives a pass rate of 29/30. Why is the normal-approximation interval a poor choice here?","options":[{"key":"A","text":"Its estimated variance shrinks near 1, so it is too narrow and can pass 1"},{"key":"B","text":"It assumes the questions are clustered"},{"key":"C","text":"It cannot be computed for fewer than 50 items"},{"key":"D","text":"It is too wide near 1"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Near 0 or 1 the plug-in variance p(1 − p)/n is small exactly where the estimate is least reliable, so coverage falls well below 95%.","misconceptions":["","Confuses the small-sample problem with clustering","Invents a hard limit; it can be computed but under-covers","Gets the direction of the error wrong"],"lo":["LO1"],"day":3,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"d3-coverage","type":"single","prompt":"In a simulation, an interval method covers the true rate in 87% of evaluations of 40 items at p = 0.95. What does that mean for a report that uses it?","options":[{"key":"A","text":"Nothing, because coverage averages out over many reports"},{"key":"B","text":"Its 95% intervals are, in effect, 87% intervals at such rates"},{"key":"C","text":"It is 8 points more precise than claimed"},{"key":"D","text":"The pass rates it reports are 8 points too high"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Coverage is the share of intervals that contain the truth; an 87% coverage means the stated 95% confidence is overstated.","misconceptions":["Thinks under-coverage cancels across reports, when each report is overconfident","","Reads under-coverage as extra precision","Confuses coverage of the interval with bias of the estimate"],"lo":["LO1"],"day":3,"session":1,"slide":null,"level":"analyze","pool":"practice"},{"id":"d3-zero-fail","type":"single","prompt":"A configuration passes all 100 questions of a safety set. What upper bound on its failure rate can be stated at 95% confidence?","options":[{"key":"A","text":"0%"},{"key":"B","text":"About 1%"},{"key":"C","text":"About 3%"},{"key":"D","text":"About 5%"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"With zero failures in n, 1 − 0.05^(1/n) ≈ 3/n = 3%.","misconceptions":["Turns zero observed failures into a zero rate","Divides 1 by n instead of using the 95% bound","","Uses 5 / n, mixing the level with the bound"],"lo":["LO1"],"day":3,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"d3-prior","type":"single","prompt":"Two analysts report Beta posterior intervals for 40 out of 40: one with a uniform prior, one with a Jeffreys prior. Their lower ends differ by about 2.6 points. What should the report do?","options":[{"key":"A","text":"Average the two intervals"},{"key":"B","text":"Use whichever prior gives the higher lower end"},{"key":"C","text":"Drop the Bayesian intervals because they disagree"},{"key":"D","text":"State the prior used, and prefer the more cautious one for a safety claim"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"At the edge the prior matters; stating it makes the claim checkable, and a safety claim should not lean on the more optimistic prior.","misconceptions":["Averages two posteriors without any model that justifies it","Chooses the prior after seeing which looks better","Treats sensitivity to the prior as a reason to report nothing",""],"lo":["LO1"],"day":3,"session":2,"slide":null,"level":"evaluate","pool":"practice"},{"id":"d3-spec","type":"single","prompt":"A model grader has specificity 0.70 in Arabic. What does that mean?","options":[{"key":"A","text":"It passes 30% of answers that people fail"},{"key":"B","text":"It agrees with people on 70% of Arabic verdicts"},{"key":"C","text":"70% of the answers it passes are right"},{"key":"D","text":"It fails 30% of answers that people pass"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Specificity is the share of truly failing answers the grader fails; the remaining 30% of failing answers are passed.","misconceptions":["","Confuses specificity with overall agreement","Describes the positive predictive value","Describes one minus sensitivity"],"lo":["LO4"],"day":3,"session":3,"slide":null,"level":"understand","pool":"practice"},{"id":"d3-agreement","type":"single","prompt":"A grader's overall agreement with people is 91%. Its Arabic specificity is 0.73 and English 0.91. Which conclusion is right?","options":[{"key":"A","text":"The grader is useless and must be replaced"},{"key":"B","text":"Arabic pass rates are inflated more than English ones; correct them by language"},{"key":"C","text":"Only English rates need correcting, since English agreement is higher"},{"key":"D","text":"The grader is reliable; no correction is needed"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Agreement hides the class-specific errors; a lower Arabic specificity passes more bad Arabic answers.","misconceptions":["Overreacts: a grader with known error rates can be corrected","","Gets the direction wrong: the lower specificity is in Arabic","Trusts overall agreement, which is dominated by the common class"],"lo":["LO4"],"day":3,"session":3,"slide":null,"level":"evaluate","pool":"practice"},{"id":"d3-correct","type":"single","prompt":"The grader passes 70% of a configuration's answers; its sensitivity is 0.90 and specificity 0.80. What is the corrected pass rate?","options":[{"key":"A","text":"About 78%"},{"key":"B","text":"About 56%"},{"key":"C","text":"About 71%"},{"key":"D","text":"About 63%"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"(0.70 + 0.80 − 1) / (0.90 + 0.80 − 1) = 0.50 / 0.70 ≈ 0.714.","misconceptions":["Divides the observed rate by the sensitivity","Multiplies the observed rate by the specificity","","Multiplies the observed rate by the sensitivity"],"lo":["LO4"],"day":3,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"d3-carry","type":"single","prompt":"A corrected pass rate's interval was built from the test set's standard error alone. Its sensitivity and specificity came from 120 labelled answers. What does the interval miss?","options":[{"key":"A","text":"The bias from the correction itself"},{"key":"B","text":"Nothing, if the test set is large"},{"key":"C","text":"The clustering of the calibration set by grader"},{"key":"D","text":"The uncertainty in sensitivity and specificity, which a joint bootstrap or delta method adds"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Sensitivity and specificity are estimates; their sampling error passes into the corrected rate and must widen the interval.","misconceptions":["The correction removes bias; the missing piece is variance","Thinks a large test set removes uncertainty in the calibration estimates","Invents a clustering that does not apply",""],"lo":["LO4"],"day":3,"session":4,"slide":null,"level":"analyze","pool":"practice"},{"id":"d4-overlap","type":"single","prompt":"48 test questions appear among the examples used to tune configuration D. On them D scores 90%; on the other questions 73%. Configurations A, B and C score the same on both groups. What follows?","options":[{"key":"A","text":"D's lead comes partly from the overlap; compare on clean questions"},{"key":"B","text":"D is better at hard questions"},{"key":"C","text":"The overlap does not matter because it is under 10% of the set"},{"key":"D","text":"The 48 questions are easier and should be dropped for every configuration"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The other configurations act as a control: the questions are not easier in general, so D's gain there comes from having seen them.","misconceptions":["","Reverses the evidence: the gain is on seen questions, not hard ones","Judges by the share of items, not by the size of the effect on the comparison","Ignores the control: A, B and C show the questions are not easier"],"lo":["LO5"],"day":4,"session":1,"slide":null,"level":"analyze","pool":"practice"},{"id":"d4-normalise","type":"single","prompt":"An overlap check by exact string match finds 8 Arabic test questions in the tuning examples; after folding hamza forms, ta marbuta, alef maqsura and diacritics it finds 21. Which count should the audit use?","options":[{"key":"A","text":"The average, about 15"},{"key":"B","text":"21, because spelling variants of the same question carry the same answer"},{"key":"C","text":"Neither: Arabic overlap cannot be measured"},{"key":"D","text":"8, because only identical strings are contamination"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A model that saw a question with a different hamza or diacritic has still seen the question; normalisation finds it.","misconceptions":["Averages two measurements of which one is known to undercount","","Gives up on a check that a simple normalisation makes reliable","Treats invisible spelling differences as different questions"],"lo":["LO5"],"day":4,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"d4-budget","type":"single","prompt":"Configuration X is reported as pass@5 (best of five) and Y as the mean of five samples. X leads by 15 points. What is the fair comparison?","options":[{"key":"A","text":"Compare X's best sample with Y's best sample on one question"},{"key":"B","text":"Keep the reported numbers; both used five samples"},{"key":"C","text":"Compare X's mean of five with Y's mean of five, or both at pass@5"},{"key":"D","text":"Halve X's lead to correct for the extra samples"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The same estimand and budget for both; a different scoring rule is a different quantity.","misconceptions":["Reduces the comparison to one question","Equal sample counts do not make different scoring rules comparable","","Invents a correction factor with no basis"],"lo":["LO5"],"day":4,"session":1,"slide":null,"level":"evaluate","pool":"practice"},{"id":"d4-classes","type":"single","prompt":"A report claims a configuration 'will perform as well next year'. The authority has no data from next year's questions. How should the audit class it?","options":[{"key":"A","text":"Supported, if the configuration ranks first"},{"key":"B","text":"Supported, if this year's interval is narrow"},{"key":"C","text":"Unsupported, because performance always drifts"},{"key":"D","text":"Untestable with the data held; name the evaluation that would test it"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"No data the authority holds come from that population, so the claim can be neither backed nor contradicted until a new evaluation exists.","misconceptions":["Confuses a rank with a forecast","Extends this year's interval to another population","Asserts a contrary claim without data",""],"lo":["LO5"],"day":4,"session":2,"slide":null,"level":"understand","pool":"practice"},{"id":"d4-supported","type":"single","prompt":"A claim says 'B is better than A'. The paired, clustered difference is 6.6 points, 95% interval 4.5 to 8.8. How should the audit class it?","options":[{"key":"A","text":"Supported: the interval of the difference excludes zero"},{"key":"B","text":"Unsupported: 6.6 points is small"},{"key":"C","text":"Untestable: A and B are different models"},{"key":"D","text":"Unsupported: the intervals of A and B overlap"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The claim is about direction, and the paired interval excludes zero; it is supported at the strength stated.","misconceptions":["","Imposes a size threshold the claim did not state","Thinks different systems cannot be compared","Uses overlap of separate intervals, which ignores the pairing"],"lo":["LO5"],"day":4,"session":2,"slide":null,"level":"evaluate","pool":"practice"},{"id":"d4-gap","type":"single","prompt":"Two language slices share 80 documents. Why is the standard error of the gap computed with document clustering rather than as √(SE_ar² + SE_en²)?","options":[{"key":"A","text":"Because the Arabic slice is larger"},{"key":"B","text":"Because a hard document lowers both languages, so the slices are correlated"},{"key":"C","text":"Because clustering always gives a smaller standard error"},{"key":"D","text":"Because the gap is a ratio, not a difference"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Shared documents make the two slice means correlated; the clustered contrast accounts for that, the independent formula does not.","misconceptions":["Slice size affects each SE, not the method for the gap","","Clustering can widen or narrow; it is about correctness, not size","The gap is a difference of rates"],"lo":["LO6"],"day":4,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"d4-corrected-gap","type":"single","prompt":"After grader correction, C's Arabic minus English gap moves from −5.8 to −9.0 points, but its interval widens to −22.2 to +2.4. What should the report say?","options":[{"key":"A","text":"There is no language gap, since the corrected interval includes zero"},{"key":"B","text":"Report only the observed gap, which is significant"},{"key":"C","text":"The best estimate of the gap is larger than observed; more Arabic labels are needed to pin it down"},{"key":"D","text":"Average the observed and corrected gaps"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Correction removes the grader's bias and adds the calibration's uncertainty; both facts belong in the report, with the step that narrows the interval.","misconceptions":["Reads a wide interval as evidence of no gap","Drops the correction because it is less convenient","","Averages a biased and an unbiased estimate"],"lo":["LO4","LO6"],"day":4,"session":3,"slide":null,"level":"evaluate","pool":"practice"},{"id":"d4-standard","type":"single","prompt":"Which field of an evaluation reporting standard would have stopped a headline that compared one configuration's best of five samples with another's mean of five?","options":[{"key":"A","text":"slices"},{"key":"B","text":"interval_method"},{"key":"C","text":"multiplicity"},{"key":"D","text":"budget_parity, with the estimand stated per configuration"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Budget parity requires the same scoring and tuning for every configuration, and a stated estimand makes a mismatch visible.","misconceptions":["Slices concern groups of questions","Interval method concerns uncertainty, not comparability","Multiplicity concerns the number of comparisons",""],"lo":["LO6"],"day":4,"session":4,"slide":null,"level":"understand","pool":"practice"},{"id":"d4-slices-required","type":"single","prompt":"A team proposes making results by language optional in the reporting standard 'to keep reports short'. What is the strongest reason to keep them required?","options":[{"key":"A","text":"An average can hide a configuration that serves one language worse, and graders can err unequally by language"},{"key":"B","text":"Regulators ask for two numbers"},{"key":"C","text":"Slices make every interval narrower"},{"key":"D","text":"Arabic results are always lower"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Without slices a weakness in one language, possibly shrunk further by a lenient grader, never reaches the decision owner.","misconceptions":["","Appeals to a rule not stated in the course","Slices widen intervals; they are required for fairness, not precision","Asserts a fixed direction that the data did not show for every configuration"],"lo":["LO6"],"day":4,"session":4,"slide":null,"level":"evaluate","pool":"practice"}]}</script>
